version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fanpay_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fanpay_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fanpay_pass_9d3091}
      POSTGRES_DB: ${DB_NAME:-fanpay_helper}
    # Порт 5432 закрыт от внешнего мира для безопасности. Доступ только внутри сети Docker.
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fanpay_user} -d ${DB_NAME:-fanpay_helper}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fanpay_backend_prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-fanpay_user}:${DB_PASSWORD:-fanpay_pass_9d3091}@db:5432/${DB_NAME:-fanpay_helper}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_9d3091}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: fanpay_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
